---
corpus_credential_directory: /etc/honeynet/corpus
corpus_credential_group: corpus-writer

corpus_credential_key_path: "{{ corpus_credential_directory }}/sensor.key"
corpus_credential_certificate_path: "{{ corpus_credential_directory }}/sensor.crt"

corpus_credential_common_name: honeynet-sensor
corpus_credential_validity: +90d
corpus_credential_minimum_validity_days: 14

corpus_credential_ca_directory: "{{ playbook_dir }}/../../pki"
corpus_credential_ca_certificate_path: "{{ corpus_credential_ca_directory }}/ca.crt"
corpus_credential_ca_key_path: "{{ corpus_credential_ca_directory }}/ca.key"

corpus_credential_signing_helper_version: 1.8.5
corpus_credential_signing_helper_url: >-
  https://rolesanywhere.amazonaws.com/releases/{{ corpus_credential_signing_helper_version }}/X86_64/Linux/Amzn2023/aws_signing_helper
corpus_credential_signing_helper_checksum: sha256:beec9ed1c492d93db809890f16713e3556353294b823c2184ad4e891f1b2b54d
corpus_credential_signing_helper_path: /usr/local/bin/aws_signing_helper

corpus_credential_aws_profile: corpus
corpus_credential_aws_credentials_path: "{{ corpus_credential_directory }}/aws-credentials"
corpus_credential_process_arguments:
  - credential-process
  - --certificate
  - "{{ corpus_credential_certificate_path }}"
  - --private-key
  - "{{ corpus_credential_key_path }}"
  - --trust-anchor-arn
  - "{{ corpus_sensor_trust_anchor_arn }}"
  - --profile-arn
  - "{{ corpus_sensor_profile_arn }}"
  - --role-arn
  - "{{ corpus_sensor_role_arn }}"
  - --region
  - "{{ corpus_region }}"
