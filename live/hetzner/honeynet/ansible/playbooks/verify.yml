---
- name: Verify the Sensor from the workstation
  hosts: sensors
  gather_facts: false
  become: false

  vars:
    verify_ssh_key: "{{ lookup('ansible.builtin.config', 'DEFAULT_PRIVATE_KEY_FILE') | expanduser }}"
    verify_ssh: >-
      ssh -o BatchMode=yes -o ConnectTimeout=10
      -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ playbook_dir }}/../.known_hosts
      -p {{ ansible_port }}

  tasks:
    - name: Log in on the admin SSH port with the Honeynet key
      ansible.builtin.command:
        cmd: "{{ verify_ssh }} -o IdentitiesOnly=yes -i {{ verify_ssh_key | quote }} admin@{{ ansible_host }} true"
      delegate_to: localhost
      register: verify_key_login
      changed_when: false
      failed_when: false

    - name: Try a password login on the admin SSH port
      ansible.builtin.command:
        cmd: >-
          {{ verify_ssh }} -o PubkeyAuthentication=no
          -o PreferredAuthentications=password,keyboard-interactive
          admin@{{ ansible_host }} true
      delegate_to: localhost
      register: verify_password_login
      changed_when: false
      failed_when: false

    - name: Require key-only SSH on the admin port
      ansible.builtin.assert:
        that:
          - verify_key_login.rc == 0
          - verify_password_login.rc == 255
          - "'Permission denied (publickey)' in verify_password_login.stderr"
        fail_msg: >-
          key login stderr={{ verify_key_login.stderr | trim }};
          password login stderr={{ verify_password_login.stderr | trim }}

- name: Verify Cowrie and the allowlist proxy from the workstation
  hosts: sensors
  gather_facts: false

  tasks:
    - name: Read the address the workstation connects from
      ansible.builtin.shell:
        cmd: echo "$SSH_CONNECTION"
      become: false
      register: verify_ssh_connection
      changed_when: false
      check_mode: false

    - name: Keep the workstation address for the Honeypot checks
      ansible.builtin.set_fact:
        verify_workstation_ip: "{{ verify_ssh_connection.stdout.split() | first }}"

    - name: Grab the Cowrie SSH banner on port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        search_regex: "{{ honeypot_persona.ssh_version | regex_escape }}"
        timeout: 30
      delegate_to: localhost
      become: false
      register: verify_cowrie_banner
      failed_when: false

    - name: Log in to Cowrie on port 23, download a file and show it
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - "wget {{ verify_cowrie_download_url }}; cat {{ verify_cowrie_download_url | basename }}"
      delegate_to: localhost
      become: false
      register: verify_cowrie_telnet
      changed_when: false
      failed_when: false

    - name: Log in to Cowrie on port 23, download a file by hostname and show it
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - "wget {{ verify_cowrie_hostname_download_url }}; cat {{ verify_cowrie_hostname_download_url | basename }}"
      delegate_to: localhost
      become: false
      register: verify_cowrie_hostname_telnet
      changed_when: false
      failed_when: false

    - name: Log in to Cowrie on port 23 and read the system identity
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - uname -a; hostname; cat /etc/os-release /etc/passwd /proc/version
      delegate_to: localhost
      become: false
      register: verify_cowrie_persona_telnet
      changed_when: false
      failed_when: false

    - name: Try a Cowrie login on port 23 with a password that is not in the userdb
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_denied_password }}"
          - --command
          - "true"
          - --timeout
          - "15"
      delegate_to: localhost
      become: false
      register: verify_cowrie_denied_telnet
      changed_when: false
      failed_when: false

    - name: Probe the proxy port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ proxy_port }}"
        timeout: 10
      delegate_to: localhost
      become: false
      register: verify_proxy_port
      failed_when: false

    - name: Probe the Sinkhole TCP ports on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ item }}"
        timeout: 10
      loop: "{{ sinkhole_redirects | selectattr('protocol', 'equalto', 'tcp') | map(attribute='sinkhole_port') | unique | list }}"
      delegate_to: localhost
      become: false
      register: verify_sinkhole_public
      failed_when: false

    - name: Read the addresses the Sinkhole listens on
      ansible.builtin.command:
        cmd: >-
          ss --tcp --udp --listening --numeric --no-header
          ( {{ sinkhole_redirects | map(attribute='sinkhole_port')
               | unique | map('regex_replace', '^', 'sport = :') | join(' or ') }} )
      register: verify_sinkhole_listeners
      changed_when: false
      check_mode: false

    - name: Require Cowrie on ports 22 and 23, closed proxy and Sinkhole ports and downloads from the Sinkhole
      vars:
        verify_telnet_session: "{{ verify_cowrie_telnet.stdout | default('{}', true) | from_json }}"
        verify_hostname_telnet_session: "{{ verify_cowrie_hostname_telnet.stdout | default('{}', true) | from_json }}"
        verify_persona_output: "{{ (verify_cowrie_persona_telnet.stdout | default('{}', true) | from_json).command_output | default('') }}"
        verify_sinkhole_listen_addresses: "{{ verify_sinkhole_listeners.stdout_lines | map('split') | map(attribute=4) | list }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_cowrie_banner.msg | default('')"
          - verify_cowrie_telnet.rc == 0
          - verify_telnet_session.negotiation | default('') is match('ff')
          - verify_telnet_session.command_completed | default(false)
          - "'Timeout' in verify_proxy_port.msg | default('')"
          - verify_sinkhole_public.results | map(attribute='msg', default='') | reject('search', 'Timeout') | list == []
          - sinkhole_marker in verify_telnet_session.command_output | default('')
          - verify_cowrie_hostname_telnet.rc == 0
          - sinkhole_marker in verify_hostname_telnet_session.command_output | default('')
          - "'honeynet' not in verify_telnet_session.command_output | default('honeynet')"
          - verify_cowrie_persona_telnet.rc == 0
          - honeypot_persona.kernel_version in verify_persona_output
          - honeypot_persona.hostname in verify_persona_output
          - honeypot_persona.os_name in verify_persona_output
          - verify_persona_output is not search('svr04|phil|Debian GNU/Linux')
          - verify_cowrie_denied_telnet.rc != 0
          - "'logged_in' not in verify_cowrie_denied_telnet.stdout"
          - verify_sinkhole_listen_addresses | length > 0
          - verify_sinkhole_listeners.stdout_lines | select('match', 'udp') | list | length > 0
          - verify_sinkhole_listen_addresses | reject('match', (sensor_private_ip | regex_escape) ~ ':') | list == []
        fail_msg: >-
          port 22 banner={{ verify_cowrie_banner.msg | default('matched') }};
          port 23 session={{ verify_cowrie_telnet.stderr | default('') | trim }}{{ verify_telnet_session.command_output | default('') }};
          port 23 hostname session={{ verify_cowrie_hostname_telnet.stderr | default('') | trim }}{{ verify_hostname_telnet_session.command_output | default('') }};
          port 23 persona session={{ verify_cowrie_persona_telnet.stderr | default('') | trim }}{{ verify_persona_output }};
          port 23 denied login rc={{ verify_cowrie_denied_telnet.rc | default('') }} {{ verify_cowrie_denied_telnet.stderr | default('') | trim }};
          proxy port {{ proxy_port }}={{ verify_proxy_port.msg | default('answered') }};
          Sinkhole ports={{ verify_sinkhole_public.results | map(attribute='msg', default='answered') | list }};
          Sinkhole listeners={{ verify_sinkhole_listeners.stdout_lines }}

- name: Verify OpenCanary and the Dark Port from the workstation
  hosts: sensors
  gather_facts: false
  become: false

  tasks:
    - name: Grab the OpenCanary FTP banner on port 21
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 21
        search_regex: "220 {{ honeypot_persona.ftp_banner | regex_escape }}"
        timeout: 30
      delegate_to: localhost
      register: verify_opencanary_ftp_banner
      failed_when: false

    - name: Try an FTP login on port 21
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --max-time
          - "20"
          - --user
          - "{{ verify_opencanary_username }}:{{ verify_opencanary_password }}"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "ftp://{{ ansible_host }}/"
      delegate_to: localhost
      register: verify_opencanary_ftp_login
      changed_when: false
      failed_when: false

    - name: Send an HTTP GET to port 80
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        timeout: 20
        return_content: true
      delegate_to: localhost
      register: verify_opencanary_http
      failed_when: false

    - name: Grab the OpenCanary MySQL banner on port 3306
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 3306
        search_regex: "{{ honeypot_persona.mysql_banner | regex_escape }}"
        timeout: 30
      delegate_to: localhost
      register: verify_opencanary_mysql_banner
      failed_when: false

    - name: Try a MySQL login on port 3306
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/opencanary_mysql_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_opencanary_username }}"
          - --password
          - "{{ verify_opencanary_password }}"
      delegate_to: localhost
      register: verify_opencanary_mysql
      changed_when: false
      failed_when: false

    - name: Try an MSSQL login on port 1433
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/opencanary_mssql_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_opencanary_username }}"
          - --password
          - "{{ verify_opencanary_password }}"
      delegate_to: localhost
      register: verify_opencanary_mssql
      changed_when: false
      failed_when: false

    - name: Probe the Dark Port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 445
        timeout: 10
      delegate_to: localhost
      register: verify_dark_port
      failed_when: false

    - name: Require OpenCanary on ports 21, 80, 1433 and 3306 and a Dark Port on 445
      vars:
        verify_mysql_login: "{{ verify_opencanary_mysql.stdout | default('{}', true) | from_json }}"
        verify_mssql_login: "{{ verify_opencanary_mssql.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_opencanary_ftp_banner.msg | default('')"
          - verify_opencanary_ftp_login.stdout == '530'
          - verify_opencanary_http.status | default(0) == 200
          - verify_opencanary_http.server | default('') == honeypot_persona.http_banner
          - "'Network Storage' not in verify_opencanary_http.content | default('Network Storage')"
          - "'Timeout' not in verify_opencanary_mysql_banner.msg | default('')"
          - verify_mysql_login.error_code | default(0) == 1045
          - verify_mssql_login.error_number | default(0) == 18456
          - "'Timeout' in verify_dark_port.msg | default('')"
        fail_msg: >-
          port 21 banner={{ verify_opencanary_ftp_banner.msg | default('matched') }};
          port 21 login={{ verify_opencanary_ftp_login.stdout | default('') }};
          port 80 status={{ verify_opencanary_http.status | default('') }} server={{ verify_opencanary_http.server | default('') }};
          port 3306 banner={{ verify_opencanary_mysql_banner.msg | default('matched') }};
          port 3306 login={{ verify_opencanary_mysql.stderr | default('') | trim }}{{ verify_mysql_login.error_message | default('') }};
          port 1433 login={{ verify_opencanary_mssql.stderr | default('') | trim }}{{ verify_mssql_login.error_message | default('') }};
          port 445={{ verify_dark_port.msg | default('answered') }}

- name: Verify every Honeynet host from inside
  hosts: all
  gather_facts: false

  vars:
    verify_is_sensor: "{{ 'sensors' in group_names }}"
    verify_sshd_baseline:
      port: "{{ ansible_port | default(22) | string }}"
      hostkeyalgorithms: ssh-ed25519
      kexalgorithms: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      ciphers: aes256-gcm@openssh.com,aes128-gcm@openssh.com
      macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      pubkeyauthentication: "yes"
      passwordauthentication: "no"
      kbdinteractiveauthentication: "no"
      permitrootlogin: "no"
      allowusers: "{{ 'admin' if verify_is_sensor else 'admin@' ~ sensor_private_ip }}"
      maxauthtries: "3"
      logingracetime: "20"
      x11forwarding: "no"
      allowagentforwarding: "no"
      permittunnel: "no"
      allowtcpforwarding: "{{ 'local' if verify_is_sensor else 'no' }}"

  tasks:
    - name: Read the effective sshd config
      ansible.builtin.command:
        cmd: sshd -T
      register: verify_sshd
      changed_when: false
      check_mode: false

    - name: Read the global IPv6 addresses
      ansible.builtin.command:
        cmd: ip -6 -o addr show scope global
      register: verify_ipv6
      changed_when: false
      check_mode: false

    - name: Read the global IPv4 addresses
      ansible.builtin.command:
        cmd: ip -4 -o addr show scope global
      register: verify_ipv4
      changed_when: false
      check_mode: false

    - name: Require the SSH hardening baseline
      vars:
        verify_sshd_effective: "{{ dict(verify_sshd.stdout_lines | select('search', ' ') | map('split', ' ', 1)) }}"
      ansible.builtin.assert:
        that: verify_sshd_effective[item.key] | default('') == item.value
        fail_msg: "sshd {{ item.key }} is '{{ verify_sshd_effective[item.key] | default('') }}', expected '{{ item.value }}'"
        quiet: true
      loop: "{{ verify_sshd_baseline | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Require an Ed25519 host key only and no public IPv6
      ansible.builtin.assert:
        that:
          - verify_sshd.stdout_lines | select('match', '^hostkey ') | list == ['hostkey /etc/ssh/ssh_host_ed25519_key']
          - verify_ipv6.stdout | trim == ''
        fail_msg: >-
          host keys={{ verify_sshd.stdout_lines | select('match', '^hostkey ') | list }};
          global IPv6={{ verify_ipv6.stdout_lines }}

    - name: Require the private IP as the only IPv4 address of a Honeypot
      vars:
        verify_host_ipv4: >-
          {{ verify_ipv4.stdout_lines | reject('search', '^[0-9]+: (docker0|br-|veth)')
             | map('regex_findall', 'inet ([0-9.]+)/') | flatten | list }}
      ansible.builtin.assert:
        that: verify_host_ipv4 == [ansible_host]
        fail_msg: "global IPv4={{ verify_ipv4.stdout_lines }}"
      when: not verify_is_sensor

- name: Verify Containment, the Sinkhole and SSH isolation from each Honeypot
  hosts: honeypots
  gather_facts: false
  become: false

  vars:
    verify_peer_honeypots: "{{ groups['honeypots'] | difference([inventory_hostname]) }}"
    verify_eve_log: /var/log/suricata/eve.json

  tasks:
    - name: Read the Containment drop counter
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      delegate_to: sensor
      become: true
      register: verify_containment_before
      changed_when: false
      check_mode: false

    - name: Open a direct TCP connection to the internet
      ansible.builtin.wait_for:
        host: "{{ verify_internet_host }}"
        port: "{{ verify_contained_port }}"
        timeout: 10
      register: verify_direct_outbound
      failed_when: false

    - name: Read the Containment drop counter again
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      delegate_to: sensor
      become: true
      register: verify_containment_after
      changed_when: false
      check_mode: false

    - name: Read the EVE log size and the Sensor time before the Sinkhole requests
      ansible.builtin.shell:
        cmd: stat --format %s {{ verify_eve_log }} && date +%s
      delegate_to: sensor
      become: true
      register: verify_sinkhole_eve_start
      changed_when: false
      check_mode: false

    - name: Keep the path of the Sinkhole requests
      ansible.builtin.set_fact:
        verify_sinkhole_path: /verify-sinkhole/{{ inventory_hostname }}/{{ verify_sinkhole_eve_start.stdout_lines[1] }}

    - name: Request a file over HTTP and HTTPS from the internet
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --insecure
          - --max-time
          - "20"
          - "{{ item }}://{{ verify_internet_host }}{{ verify_sinkhole_path }}"
      loop:
        - http
        - https
      register: verify_sinkhole_requests
      changed_when: false
      failed_when: false

    - name: Read the EVE http events of the Sinkhole request
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            log_path, offset, path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            events = []
            with open(log_path, "rb") as log:
                log.seek(0, 2)
                log.seek(offset if log.tell() >= offset else 0)
                for line in log:
                    try:
                        event = json.loads(line)
                    except ValueError:
                        continue
                    if event.get("event_type") == "http" and event.get("http", {}).get("url") == path:
                        events.append({"src_ip": event.get("src_ip"), "hostname": event["http"].get("hostname")})
            print(json.dumps(events))
          - "{{ verify_eve_log }}"
          - "{{ verify_sinkhole_eve_start.stdout_lines[0] }}"
          - "{{ verify_sinkhole_path }}"
      delegate_to: sensor
      become: true
      register: verify_sinkhole_eve
      changed_when: false
      check_mode: false
      retries: 12
      delay: 5
      until: verify_sinkhole_eve.stdout | default('[]', true) | from_json | length > 0
      ignore_errors: true

    - name: Query a public resolver for a hostname over UDP and TCP
      ansible.builtin.command:
        argv:
          - dig
          - +tries=1
          - +time=5
          - +noall
          - +comments
          - +answer
          - "{{ item.transport }}"
          - "@{{ verify_dns_query_server }}"
          - "{{ verify_dns_query_name }}"
          - "{{ item.type }}"
      loop:
        - { type: A, transport: +notcp }
        - { type: A, transport: +tcp }
        - { type: AAAA, transport: +notcp }
        - { type: AAAA, transport: +tcp }
      loop_control:
        label: "{{ item.type }} {{ item.transport }}"
      register: verify_sinkhole_dns
      changed_when: false
      failed_when: false

    - name: Open an SSH connection to the other Honeypots
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 10
      loop: "{{ verify_peer_honeypots }}"
      register: verify_peer_ssh
      failed_when: false

    - name: Require Containment, the Sinkhole marker over HTTP and HTTPS, its EVE http event, the Sinkhole DNS answers and no SSH between Honeypots
      vars:
        verify_dns_a_answer: >-
          ^{{ verify_dns_query_name | regex_escape }}\.\s+\d+\s+IN\s+A\s+{{ sinkhole_dns_answer | regex_escape }}$
        verify_dns_a_results: "{{ verify_sinkhole_dns.results | selectattr('item.type', 'equalto', 'A') | list }}"
        verify_dns_aaaa_results: "{{ verify_sinkhole_dns.results | selectattr('item.type', 'equalto', 'AAAA') | list }}"
        verify_drops_before: "{{ (verify_containment_before.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_drops_after: "{{ (verify_containment_after.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_sinkhole_http_events: "{{ verify_sinkhole_eve.stdout | default('[]', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' in verify_direct_outbound.msg | default('')"
          - verify_drops_after | first | int > verify_drops_before | first | int
          - verify_sinkhole_requests.results | map(attribute='stdout', default='') | reject('search', sinkhole_marker) | list == []
          - >-
            verify_sinkhole_http_events | selectattr('src_ip', 'equalto', ansible_host)
            | selectattr('hostname', 'equalto', verify_internet_host) | list | length > 0
          - verify_sinkhole_dns.results | map(attribute='rc') | reject('equalto', 0) | list == []
          - "verify_sinkhole_dns.results | map(attribute='stdout') | reject('search', 'status: NOERROR') | list == []"
          - verify_dns_a_results | map(attribute='stdout') | reject('search', verify_dns_a_answer, multiline=true) | list == []
          - "verify_dns_aaaa_results | map(attribute='stdout') | reject('search', 'ANSWER: 0,') | list == []"
          - verify_peer_ssh.results | map(attribute='msg', default='') | reject('search', 'Timeout') | list == []
        fail_msg: >-
          direct outbound to {{ verify_internet_host }}:{{ verify_contained_port }}={{ verify_direct_outbound.msg | default('connected') }};
          Containment drops before={{ verify_drops_before | first }} after={{ verify_drops_after | first }};
          Sinkhole HTTP and HTTPS={{ verify_sinkhole_requests.results | map(attribute='stdout', default='') | list }}
          {{ verify_sinkhole_requests.results | map(attribute='stderr', default='') | list }};
          EVE http events of {{ verify_sinkhole_path }}={{ verify_sinkhole_http_events }};
          Sinkhole DNS={{ verify_sinkhole_dns.results | map(attribute='stdout', default='') | list }}
          {{ verify_sinkhole_dns.results | map(attribute='stderr', default='') | list }};
          SSH to the other Honeypots={{ verify_peer_ssh.results | map(attribute='msg', default='connected') | list }}

- name: Verify the Cowrie sessions and the allowlist proxy from each Honeypot
  hosts: honeypots
  gather_facts: false

  vars:
    verify_cowrie_log: "{{ cowrie_dir }}/var/log/cowrie/cowrie.json"
    verify_workstation_ip: "{{ hostvars['sensor'].verify_workstation_ip }}"
    verify_allowlisted_url: http://archive.ubuntu.com/ubuntu/dists/noble/Release
    verify_denied_url: http://example.com/

  tasks:
    - name: Read the sessions Cowrie recorded
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            source_ips, commands, downloads, failed_downloads = set(), [], [], []
            with open(sys.argv[1]) as log:
                for line in log:
                    event = json.loads(line)
                    if "src_ip" in event:
                        source_ips.add(event["src_ip"])
                    if event.get("eventid") == "cowrie.command.input":
                        commands.append(event.get("input", ""))
                    if event.get("eventid") == "cowrie.session.file_download":
                        downloads.append(event.get("url", ""))
                    if event.get("eventid") == "cowrie.session.file_download.failed":
                        failed_downloads.append(event.get("url", ""))
            print(json.dumps({
                "source_ips": sorted(source_ips),
                "commands": commands,
                "downloads": downloads,
                "failed_downloads": failed_downloads,
            }))
          - "{{ verify_cowrie_log }}"
      register: verify_cowrie_sessions
      changed_when: false
      check_mode: false

    - name: Request an allowlisted domain through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_allowlisted_url }}"
      register: verify_proxy_allowed
      changed_when: false
      failed_when: false

    - name: Request a domain that is not on the allowlist through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_denied_url }}"
      register: verify_proxy_denied
      changed_when: false
      failed_when: false

    - name: Require the attacker address and the download in the Cowrie log and an allowlist that refuses
      vars:
        verify_cowrie_session: "{{ verify_cowrie_sessions.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_workstation_ip in verify_cowrie_session.source_ips | default([])
          - sensor_private_ip not in verify_cowrie_session.source_ips | default([])
          - verify_cowrie_session.commands | default([]) | select('search', verify_cowrie_download_url) | list | length > 0
          - verify_cowrie_download_url in verify_cowrie_session.downloads | default([])
          - verify_cowrie_hostname_download_url in verify_cowrie_session.downloads | default([])
          - verify_proxy_allowed.stdout == '200'
          - verify_proxy_denied.stdout == '403'
        fail_msg: >-
          Cowrie source addresses={{ verify_cowrie_session.source_ips | default('none') }};
          Cowrie commands={{ verify_cowrie_session.commands | default('none') }};
          Cowrie downloads={{ verify_cowrie_session.downloads | default('none') }};
          Cowrie failed downloads={{ verify_cowrie_session.failed_downloads | default('none') }};
          allowlisted domain={{ verify_proxy_allowed.stdout | default('') }} {{ verify_proxy_allowed.stderr | default('') | trim }};
          domain not on the allowlist={{ verify_proxy_denied.stdout | default('') }} {{ verify_proxy_denied.stderr | default('') | trim }}

- name: Verify the OpenCanary records from each Honeypot
  hosts: honeypots
  gather_facts: false

  vars:
    verify_opencanary_log: "{{ opencanary_dir }}/var/opencanary.log"
    verify_workstation_ip: "{{ hostvars['sensor'].verify_workstation_ip }}"
    verify_opencanary_logtypes: [2000, 3000, 8001, 9001]

  tasks:
    - name: Read the records OpenCanary wrote
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            source_hosts, logtypes = set(), set()
            with open(sys.argv[1]) as log:
                for line in log:
                    record = json.loads(line)
                    source_hosts.add(record.get("src_host", ""))
                    logtypes.add(record.get("logtype"))
            print(json.dumps({"source_hosts": sorted(source_hosts), "logtypes": sorted(logtypes)}))
          - "{{ verify_opencanary_log }}"
      register: verify_opencanary_records
      changed_when: false
      check_mode: false

    - name: Require the attacker address in the OpenCanary log and one record of each logtype
      vars:
        verify_opencanary_record: "{{ verify_opencanary_records.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_workstation_ip in verify_opencanary_record.source_hosts | default([])
          - sensor_private_ip not in verify_opencanary_record.source_hosts | default([])
          - verify_opencanary_logtypes | difference(verify_opencanary_record.logtypes | default([])) == []
        fail_msg: >-
          OpenCanary source addresses={{ verify_opencanary_record.source_hosts | default('none') }};
          OpenCanary logtypes={{ verify_opencanary_record.logtypes | default('none') }}

- name: Verify the Log Volume on the Sensor
  hosts: sensors
  gather_facts: false

  vars:
    verify_log_volume_mounts:
      - where: /srv/honeynet
        fsroot: /
      - where: /var/log/suricata
        fsroot: /suricata
        service: suricata.service
      - where: /var/lib/evebox
        fsroot: /evebox
        service: evebox.service
      - where: /var/lib/vector
        fsroot: /vector
        service: vector.service

  tasks:
    - name: Read the disk behind the Log Volume device
      ansible.builtin.command:
        cmd: readlink -f {{ log_volume_device }}
      register: verify_log_volume_disk
      changed_when: false
      check_mode: false

    - name: Read the Log Volume mounts
      ansible.builtin.command:
        cmd: findmnt -n -o SOURCE,FSROOT --mountpoint {{ item.where }}
      loop: "{{ verify_log_volume_mounts }}"
      loop_control:
        label: "{{ item.where }}"
      register: verify_log_volume_findmnt
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the mounts that Suricata and EveBox require
      ansible.builtin.command:
        cmd: systemctl show -p RequiresMountsFor --value {{ item.service }}
      loop: "{{ verify_log_volume_mounts | selectattr('service', 'defined') }}"
      loop_control:
        label: "{{ item.service }}"
      register: verify_log_volume_requires
      changed_when: false
      check_mode: false

    - name: Require each log directory on the Log Volume
      vars:
        verify_log_volume_mount: "{{ item.stdout.split() }}"
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - verify_log_volume_mount[0] is match(verify_log_volume_disk.stdout ~ '($|\\[)')
          - verify_log_volume_mount[1] == item.item.fsroot
        fail_msg: >-
          {{ item.item.where }} is mounted from '{{ item.stdout | default('nothing', true) }}',
          expected {{ verify_log_volume_disk.stdout }} at {{ item.item.fsroot }}
        quiet: true
      loop: "{{ verify_log_volume_findmnt.results }}"
      loop_control:
        label: "{{ item.item.where }}"

    - name: Require that Suricata, EveBox and Vector do not start without the Log Volume
      ansible.builtin.assert:
        that: item.item.where in item.stdout.split()
        fail_msg: "{{ item.item.service }} requires the mounts '{{ item.stdout }}', expected {{ item.item.where }}"
        quiet: true
      loop: "{{ verify_log_volume_requires.results }}"
      loop_control:
        label: "{{ item.item.service }}"

- name: Verify Suricata on the Sensor
  hosts: sensors
  gather_facts: false

  vars:
    verify_eve_log: /var/log/suricata/eve.json
    verify_suricata_rule_directories:
      - /var/lib/suricata/rules
      - /etc/suricata/rules
    verify_suricata_owned_directories:
      - /var/lib/suricata
      - /var/log/suricata
    verify_suricata_expected_alerts: >-
      {{ [suricata_canary_rules.alert.sid ~ ' allowed']
         + ([suricata_canary_rules.drop.sid ~ ' blocked'] if suricata_mode == 'ips' else []) }}

  tasks:
    - name: Read the account that runs Suricata
      ansible.builtin.shell:
        cmd: ps -o user= -p "$(systemctl show --property MainPID --value suricata.service)"
      register: verify_suricata_account
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the NFQUEUE bindings
      ansible.builtin.command:
        cmd: cat /proc/net/netfilter/nfnetlink_queue
      register: verify_nfqueue
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Update the rules as the Suricata account
      ansible.builtin.systemd_service:
        name: suricata-update.service
        state: started
      register: verify_suricata_update
      changed_when: false
      ignore_errors: true

    - name: Read the files below the Suricata trees that the account does not own
      ansible.builtin.command:
        argv: "{{ ['find'] + verify_suricata_owned_directories + ['!', '-user', 'suricata', '-print'] }}"
      register: verify_suricata_foreign_files
      changed_when: false
      check_mode: false

    - name: Read the rule files that the Suricata account cannot read
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'suricata', '--', 'find'] + verify_suricata_rule_directories + ['-type', 'f', '!', '-readable', '-print'] }}"
        chdir: /
      register: verify_suricata_unreadable_rules
      changed_when: false
      check_mode: false

    - name: Load the user data rule set in an empty network namespace
      ansible.builtin.shell:
        cmd: unshare --net sh -c 'nft -f /etc/nftables.conf && nft --stateless list ruleset'
      register: verify_user_data_ruleset
      changed_when: false
      check_mode: false

    - name: Read the live rule set
      ansible.builtin.command:
        cmd: nft --stateless list ruleset
      register: verify_live_ruleset
      changed_when: false
      check_mode: false

    - name: Read the EVE log size and the Sensor time before the probes
      ansible.builtin.shell:
        cmd: stat --format %s {{ verify_eve_log }} && date +%s
      register: verify_eve_start
      changed_when: false
      check_mode: false

    - name: Keep the start of the probes
      ansible.builtin.set_fact:
        verify_eve_offset: "{{ verify_eve_start.stdout_lines[0] }}"
        verify_probe_epoch: "{{ verify_eve_start.stdout_lines[1] }}"
        verify_canary_nonce: verify-{{ verify_eve_start.stdout_lines[1] }}

    - name: Send the canary alert string to Cowrie on port 23
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - echo {{ suricata_canary_rules.alert.content }} {{ verify_canary_nonce }}
      delegate_to: localhost
      become: false
      register: verify_canary_alert_session
      changed_when: false
      failed_when: false

    - name: Send the canary drop string to Cowrie on port 23
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - echo {{ suricata_canary_rules.drop.content }} {{ verify_canary_nonce }}
          - --timeout
          - "20"
      delegate_to: localhost
      become: false
      register: verify_canary_drop_session
      changed_when: false
      failed_when: false
      when: suricata_mode == 'ips'

    - name: Probe the Dark Port again for the EVE check
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 445
        timeout: 5
      delegate_to: localhost
      become: false
      failed_when: false

    - name: Read the EVE events from the workstation since the probes started
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            log_path, offset, workstation_ip = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            alerts, dark_port_events = set(), set()
            with open(log_path, "rb") as log:
                log.seek(0, 2)
                log.seek(offset if log.tell() >= offset else 0)
                for line in log:
                    try:
                        event = json.loads(line)
                    except ValueError:
                        continue
                    if event.get("src_ip") != workstation_ip:
                        continue
                    if event.get("event_type") == "alert":
                        alerts.add(f'{event["alert"]["signature_id"]} {event["alert"]["action"]}')
                    if event.get("dest_port") == 445:
                        dark_port_events.add(event.get("event_type"))
            print(json.dumps({"alerts": sorted(alerts), "dark_port_events": sorted(dark_port_events)}))
          - "{{ verify_eve_log }}"
          - "{{ verify_eve_offset }}"
          - "{{ verify_workstation_ip }}"
      register: verify_eve_events
      changed_when: false
      check_mode: false
      retries: 18
      delay: 10
      until: >-
        verify_suricata_expected_alerts
        | difference((verify_eve_events.stdout | default('{}', true) | from_json).alerts | default([]))
        == []
        and (verify_eve_events.stdout | default('{}', true) | from_json).dark_port_events | default([]) | length > 0
      ignore_errors: true

    - name: Find the PCAP file of the canary alert flow
      ansible.builtin.command:
        argv:
          - find
          - /var/log/suricata
          - -maxdepth
          - "1"
          - -name
          - log.pcap*
          - -newermt
          - "@{{ verify_probe_epoch }}"
          - -exec
          - grep
          - --files-with-matches
          - --text
          - --fixed-strings
          - --regexp
          - "{{ suricata_canary_rules.alert.content }} {{ verify_canary_nonce }}"
          - "{}"
          - +
      register: verify_canary_pcap
      changed_when: false
      check_mode: false
      retries: 6
      delay: 10
      until: verify_canary_pcap.stdout | length > 0
      failed_when: false
      ignore_errors: true

    - name: Require Suricata as its account, readable rules and the user data rule set
      vars:
        verify_nfqueue_numbers: "{{ verify_nfqueue.stdout_lines | map('split') | map('first') | list }}"
      ansible.builtin.assert:
        that:
          - verify_suricata_account.stdout | trim == 'suricata'
          - suricata_mode != 'ips' or '0' in verify_nfqueue_numbers
          - verify_suricata_update is succeeded
          - verify_suricata_foreign_files.stdout_lines == []
          - verify_suricata_unreadable_rules.stdout_lines == []
          - verify_live_ruleset.stdout == verify_user_data_ruleset.stdout
        fail_msg: >-
          Suricata account={{ verify_suricata_account.stdout | trim }};
          NFQUEUE bindings={{ verify_nfqueue.stdout_lines }};
          rule update={{ verify_suricata_update.msg | default('passed') }};
          files the account does not own={{ verify_suricata_foreign_files.stdout_lines }};
          rule files the account cannot read={{ verify_suricata_unreadable_rules.stdout_lines }};
          live rule set is the user data rule set={{ verify_live_ruleset.stdout == verify_user_data_ruleset.stdout }}

    - name: Require the canary alerts, a PCAP file of the alert flow and EVE events from the Dark Port
      vars:
        verify_eve: "{{ verify_eve_events.stdout | default('{}', true) | from_json }}"
        verify_alert_session: "{{ verify_canary_alert_session.stdout | default('{}', true) | from_json }}"
        verify_drop_session: "{{ verify_canary_drop_session.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_alert_session.command_completed | default(false)
          - suricata_mode != 'ips' or not verify_drop_session.command_completed | default(true)
          - verify_suricata_expected_alerts | difference(verify_eve.alerts | default([])) == []
          - verify_canary_pcap.stdout_lines | length > 0
          - verify_eve.dark_port_events | default([]) | length > 0
        fail_msg: >-
          alert session={{ verify_canary_alert_session.stderr | default('') | trim }}{{ verify_alert_session.command_output | default('') }};
          drop session completed={{ verify_drop_session.command_completed | default('not run') }};
          expected alerts={{ verify_suricata_expected_alerts }};
          EVE alerts={{ verify_eve.alerts | default('none') }};
          PCAP files of the alert flow={{ verify_canary_pcap.stdout_lines }};
          EVE events from the Dark Port={{ verify_eve.dark_port_events | default('none') }}

- name: Verify EveBox on the Sensor
  hosts: sensors
  gather_facts: false
  become: false

  vars:
    verify_evebox_tunnel_port: 15636
    verify_evebox_canary_query: >-
      alert.signature_id:{{ suricata_canary_rules.alert.sid }}
      src_ip:{{ verify_workstation_ip }}
      @after:{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(verify_probe_epoch | int, utc=true) }}

  tasks:
    - name: Probe the EveBox port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ evebox_port }}"
        timeout: 10
      delegate_to: localhost
      register: verify_evebox_public
      failed_when: false

    - name: Read the addresses EveBox listens on
      ansible.builtin.command:
        cmd: ss --tcp --listening --numeric --no-header sport = :{{ evebox_port }}
      register: verify_evebox_listeners
      changed_when: false
      check_mode: false

    - name: Open EveBox through an SSH local forward from the workstation
      ansible.builtin.shell:
        cmd: >-
          ssh -f -o BatchMode=yes -o ConnectTimeout=10 -o ExitOnForwardFailure=yes
          -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ playbook_dir }}/../.known_hosts
          -o IdentitiesOnly=yes -i {{ lookup('ansible.builtin.config', 'DEFAULT_PRIVATE_KEY_FILE') | expanduser | quote }}
          -p {{ ansible_port }}
          -L 127.0.0.1:{{ verify_evebox_tunnel_port }}:127.0.0.1:{{ evebox_port }}
          admin@{{ ansible_host }} sleep 20
          && curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}'
          http://127.0.0.1:{{ verify_evebox_tunnel_port }}/
      delegate_to: localhost
      register: verify_evebox_tunnel
      changed_when: false
      failed_when: false

    - name: Find the canary alert through the EveBox API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ evebox_port }}/api/events?{{ {'event_type': 'alert', 'query_string': verify_evebox_canary_query} | urlencode }}"
        return_content: true
      register: verify_evebox_alerts
      retries: 12
      delay: 5
      until: verify_evebox_alerts.json.events | default([]) | length > 0
      failed_when: false

    - name: Require EveBox on localhost only, through the SSH tunnel, with the canary alert
      vars:
        verify_evebox_listen_addresses: "{{ verify_evebox_listeners.stdout_lines | map('split') | map(attribute=3) | list }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' in verify_evebox_public.msg | default('')"
          - verify_evebox_listen_addresses | length > 0
          - verify_evebox_listen_addresses | reject('match', '127\\.0\\.0\\.1:') | list == []
          - verify_evebox_tunnel.stdout == '200'
          - verify_evebox_alerts.json.events | default([]) | length > 0
        fail_msg: >-
          port {{ evebox_port }} on the public IPv4={{ verify_evebox_public.msg | default('answered') }};
          EveBox listen addresses={{ verify_evebox_listen_addresses }};
          SSH tunnel={{ verify_evebox_tunnel.stdout }} {{ verify_evebox_tunnel.stderr | trim }};
          EveBox query '{{ verify_evebox_canary_query }}'={{ verify_evebox_alerts.status | default('') }} {{ verify_evebox_alerts.msg | default('') }}

- name: Verify the path from the Sensor to the Corpus
  hosts: sensors
  gather_facts: false

  vars_files:
    - ../roles/corpus_credential/defaults/main.yml

  vars:
    verify_eve_log: /var/log/suricata/eve.json
    verify_corpus_delivery_retries: 42
    verify_corpus_delivery_delay: 10
    verify_sensor_credentials: "{{ verify_sensor_session.stdout | default('{}', true) | from_json }}"

  tasks:
    - name: Read the input chain of the Sensor
      ansible.builtin.command:
        cmd: nft --stateless list chain inet filter input
      register: verify_input_chain
      changed_when: false
      check_mode: false

    - name: Read whether the Sensor certificate stays valid for the minimum days
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -noout
          - -enddate
          - -checkend
          - "{{ corpus_credential_minimum_validity_days * 86400 }}"
          - -in
          - "{{ corpus_credential_certificate_path }}"
      register: verify_certificate_validity
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Request a Corpus session as the Vector account
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'vector', '--', corpus_credential_signing_helper_path] + corpus_credential_process_arguments }}"
        chdir: /
      register: verify_sensor_session
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Read the Sensor time for the probe object
      ansible.builtin.command:
        cmd: date +%s
      register: verify_corpus_probe_epoch
      changed_when: false
      check_mode: false

    - name: Write, read, list and delete in the Corpus with the Sensor session
      ansible.builtin.command:
        argv: "{{ ['env', '-u', 'AWS_PROFILE', '-u', 'AWS_DEFAULT_PROFILE', 'aws', '--region', corpus_region, 's3api'] + item.argv }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ verify_sensor_credentials.AccessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ verify_sensor_credentials.SecretAccessKey }}"
        AWS_SESSION_TOKEN: "{{ verify_sensor_credentials.SessionToken }}"
      vars:
        verify_probe_key: verify/sensor-credential/{{ inventory_hostname }}-{{ verify_corpus_probe_epoch.stdout }}
      loop:
        - action: write
          argv: [put-object, --bucket, "{{ corpus_bucket_name }}", --key, "{{ verify_probe_key }}"]
        - action: read
          argv: [get-object, --bucket, "{{ corpus_bucket_name }}", --key, "{{ verify_probe_key }}", /dev/null]
        - action: list
          argv: [list-objects-v2, --bucket, "{{ corpus_bucket_name }}", --max-items, "1"]
        - action: delete
          argv: [delete-object, --bucket, "{{ corpus_bucket_name }}", --key, "{{ verify_probe_key }}"]
      loop_control:
        label: "{{ item.action }}"
      delegate_to: localhost
      become: false
      register: verify_sensor_session_actions
      changed_when: false
      failed_when: false
      when: verify_sensor_session.rc == 0
      no_log: true

    - name: Remove the probe object with the Operator profile
      ansible.builtin.command:
        argv:
          - aws
          - --region
          - "{{ corpus_region }}"
          - s3api
          - delete-object
          - --bucket
          - "{{ corpus_bucket_name }}"
          - --key
          - "{{ verify_probe_write.item.argv[4] }}"
          - --version-id
          - "{{ (verify_probe_write.stdout | from_json).VersionId }}"
      vars:
        verify_probe_write: "{{ verify_sensor_session_actions.results | selectattr('item.action', 'equalto', 'write') | first }}"
      delegate_to: localhost
      become: false
      changed_when: true
      failed_when: false
      when: >-
        verify_sensor_session_actions.results | default([])
        | selectattr('item.action', 'equalto', 'write') | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length > 0

    - name: Request a Corpus session from the workstation address with a test certificate
      delegate_to: localhost
      become: false
      block:
        - name: Create a scratch directory for the test certificate
          ansible.builtin.tempfile:
            state: directory
            suffix: -honeynet-verify
          register: verify_scratch

        - name: Download the signing helper to the scratch directory
          ansible.builtin.get_url:
            url: "{{ corpus_credential_signing_helper_url }}"
            checksum: "{{ corpus_credential_signing_helper_checksum }}"
            dest: "{{ verify_scratch.path }}/aws_signing_helper"
            mode: "0700"

        - name: Generate the test private key
          community.crypto.openssl_privatekey:
            path: "{{ verify_scratch.path }}/test.key"
            type: ECC
            curve: secp256r1
            mode: "0600"

        - name: Create a signing request for the test certificate
          community.crypto.openssl_csr_pipe:
            privatekey_path: "{{ verify_scratch.path }}/test.key"
            common_name: honeynet-verify-workstation
            basic_constraints:
              - CA:FALSE
            basic_constraints_critical: true
            key_usage:
              - digitalSignature
            key_usage_critical: true
          register: verify_test_csr
          changed_when: false

        - name: Issue a test certificate from the Sensor CA for one day
          community.crypto.x509_certificate:
            path: "{{ verify_scratch.path }}/test.crt"
            csr_content: "{{ verify_test_csr.csr }}"
            provider: ownca
            ownca_path: "{{ corpus_credential_ca_certificate_path }}"
            ownca_privatekey_path: "{{ corpus_credential_ca_key_path }}"
            ownca_not_after: +1d
            ownca_digest: sha256
            mode: "0600"

        - name: Request a Corpus session with the test certificate
          ansible.builtin.command:
            argv:
              - "{{ verify_scratch.path }}/aws_signing_helper"
              - credential-process
              - --certificate
              - "{{ verify_scratch.path }}/test.crt"
              - --private-key
              - "{{ verify_scratch.path }}/test.key"
              - --trust-anchor-arn
              - "{{ corpus_sensor_trust_anchor_arn }}"
              - --profile-arn
              - "{{ corpus_sensor_profile_arn }}"
              - --role-arn
              - "{{ corpus_sensor_role_arn }}"
              - --region
              - "{{ corpus_region }}"
          register: verify_workstation_session
          changed_when: false
          failed_when: false
          no_log: true

      always:
        - name: Discard the test certificate and key
          ansible.builtin.file:
            path: "{{ verify_scratch.path }}"
            state: absent
          when: verify_scratch.path is defined

    - name: Read the EVE log size and the Sensor time before the Corpus canary
      ansible.builtin.shell:
        cmd: stat --format %s {{ verify_eve_log }} && date -u +%Y-%m-%dT%H:%M:%S && date +%s
      register: verify_corpus_eve_start
      changed_when: false
      check_mode: false

    - name: Keep the start of the Corpus canary
      ansible.builtin.set_fact:
        verify_corpus_eve_offset: "{{ verify_corpus_eve_start.stdout_lines[0] }}"
        verify_corpus_since: "{{ verify_corpus_eve_start.stdout_lines[1] }}"
        verify_corpus_nonce: corpus-{{ verify_corpus_eve_start.stdout_lines[2] }}

    - name: Send the canary through Vector while it cannot reach the object store, and restart Vector
      block:
        - name: Cut Vector off from the object store
          ansible.builtin.command:
            cmd: nft -f -
            stdin: |
              table inet verify_corpus {
                chain output {
                  type filter hook output priority filter; policy accept;
                  meta skuid "vector" tcp dport 443 reject with tcp reset
                }
              }
          changed_when: true

        - name: Send the canary alert string to Cowrie on port 23
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
              - --host
              - "{{ ansible_host }}"
              - --username
              - "{{ verify_cowrie_username }}"
              - --password
              - "{{ verify_cowrie_password }}"
              - --command
              - echo {{ suricata_canary_rules.alert.content }} {{ verify_corpus_nonce }}
          delegate_to: localhost
          become: false
          changed_when: false
          failed_when: false

        - name: Read the canary EVE event
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json, socket, sys
                from datetime import datetime, timezone
                log_path, offset, workstation_ip, sid = sys.argv[1], int(sys.argv[2]), sys.argv[3], int(sys.argv[4])
                with open(log_path, "rb") as log:
                    log.seek(0, 2)
                    log.seek(offset if log.tell() >= offset else 0)
                    for raw in log:
                        line = raw.decode().rstrip("\n")
                        try:
                            event = json.loads(line)
                        except ValueError:
                            continue
                        if (event.get("event_type") == "alert" and event.get("src_ip") == workstation_ip
                                and event["alert"].get("signature_id") == sid):
                            event_time = datetime.strptime(event["timestamp"], "%Y-%m-%dT%H:%M:%S.%f%z")
                            print(json.dumps({
                                "line": line,
                                "dt": event_time.astimezone(timezone.utc).strftime("%Y-%m-%d"),
                                "host": socket.gethostname(),
                            }))
                            break
              - "{{ verify_eve_log }}"
              - "{{ verify_corpus_eve_offset }}"
              - "{{ verify_workstation_ip }}"
              - "{{ suricata_canary_rules.alert.sid }}"
          register: verify_corpus_canary_event
          changed_when: false
          check_mode: false
          retries: 12
          delay: 5
          until: verify_corpus_canary_event.stdout | length > 0
          ignore_errors: true

        - name: Wait for Vector to read the canary event into its buffer
          ansible.builtin.pause:
            seconds: 15

        - name: Restart Vector while it cannot reach the object store
          ansible.builtin.systemd_service:
            name: vector.service
            state: restarted

      always:
        - name: Connect Vector to the object store again
          ansible.builtin.command:
            cmd: nft delete table inet verify_corpus
          changed_when: true
          failed_when: false

    - name: Find the canary EVE event in the Corpus under its partition
      ansible.builtin.shell:
        cmd: |
          aws s3api list-objects-v2 --region "$VERIFY_REGION" --bucket "$VERIFY_BUCKET" --prefix "$VERIFY_PREFIX" \
            --query 'Contents[].[LastModified, Key]' --output text \
          | awk -v since="$VERIFY_SINCE" '$1 >= since { print $2 }' \
          | while read -r key; do
              if aws s3 cp --region "$VERIFY_REGION" --quiet "s3://$VERIFY_BUCKET/$key" - < /dev/null \
                | gunzip -c | grep -qxF -e "$VERIFY_CANARY_LINE"; then
                echo "$key"
                break
              fi
            done \
          | grep .
      environment:
        VERIFY_REGION: "{{ corpus_region }}"
        VERIFY_BUCKET: "{{ corpus_bucket_name }}"
        VERIFY_PREFIX: source=suricata/host={{ verify_corpus_canary.host }}/dt={{ verify_corpus_canary.dt }}/
        VERIFY_SINCE: "{{ verify_corpus_since }}"
        VERIFY_CANARY_LINE: "{{ verify_corpus_canary.line }}"
      vars:
        verify_corpus_canary: "{{ verify_corpus_canary_event.stdout | from_json }}"
      delegate_to: localhost
      become: false
      register: verify_corpus_canary_object
      changed_when: false
      retries: "{{ verify_corpus_delivery_retries }}"
      delay: "{{ verify_corpus_delivery_delay }}"
      until: verify_corpus_canary_object.rc == 0
      when: verify_corpus_canary_event.stdout | default('') | length > 0
      ignore_errors: true

    - name: Require Honeynet-only collector and time ports, a write-only Sensor session, a refused workstation session, a valid certificate and the canary in the Corpus
      vars:
        verify_port_rules: >-
          {{ verify_input_chain.stdout_lines | map('trim')
             | select('search', '(tcp dport ' ~ collector_port ~ '|udp dport 123) ') | list }}
        verify_honeynet_source: "{{ ('ip saddr ' ~ honeynet_network_ip_range) | regex_escape }} "
        verify_session_results: "{{ verify_sensor_session_actions.results | default([]) }}"
        verify_session_write: "{{ verify_session_results | selectattr('item.action', 'equalto', 'write') | first | default({}) }}"
        verify_session_denied: "{{ verify_session_results | selectattr('item.action', 'in', ['read', 'list', 'delete']) | list }}"
      ansible.builtin.assert:
        that:
          - verify_port_rules | select('search', 'tcp dport ' ~ collector_port ~ ' ') | list | length > 0
          - verify_port_rules | select('search', 'udp dport 123 ') | list | length > 0
          - verify_port_rules | reject('match', verify_honeynet_source) | list == []
          - verify_certificate_validity.rc == 0
          - verify_sensor_session.rc == 0
          - verify_session_write.rc | default(1) == 0
          - verify_session_denied | length == 3
          - verify_session_denied | map(attribute='rc', default=0) | select('equalto', 0) | list == []
          - verify_session_denied | map(attribute='stderr', default='') | reject('search', 'AccessDenied') | list == []
          - verify_workstation_session.rc | default(0) != 0
          - "'AccessDenied' in verify_workstation_session.stderr | default('')"
          - verify_corpus_canary_event.stdout | default('') | length > 0
          - verify_corpus_canary_object.rc | default(1) == 0
        fail_msg: >-
          collector and time port rules={{ verify_port_rules }};
          certificate={{ verify_certificate_validity.stdout_lines | default([]) }}, expected valid for {{ corpus_credential_minimum_validity_days }} more days;
          Sensor session rc={{ verify_sensor_session.rc | default('') }} {{ verify_sensor_session.stderr | default('') | trim }};
          Sensor session write rc={{ verify_session_write.rc | default('not run') }} {{ verify_session_write.stderr | default('') | trim }};
          Sensor session read, list and delete={{ verify_session_denied | map(attribute='stderr', default='not run') | map('trim') | list }};
          workstation session rc={{ verify_workstation_session.rc | default('not run') }} {{ verify_workstation_session.stderr | default('') | trim }};
          canary EVE event={{ verify_corpus_canary_event.stdout | default('none', true) }};
          canary object={{ verify_corpus_canary_object.stdout | default('none', true) }} {{ verify_corpus_canary_object.stderr | default('') | trim }}

- name: Verify the time service from each Honeypot
  hosts: honeypots
  gather_facts: false

  tasks:
    - name: Read the time server and the synchronisation state
      ansible.builtin.shell:
        cmd: >-
          timedatectl show-timesync --property=ServerAddress --value
          && timedatectl show --property=NTPSynchronized --value
      register: verify_timesync
      changed_when: false
      check_mode: false
      retries: 12
      delay: 5
      until: verify_timesync.stdout_lines | default([]) == [sensor_private_ip, 'yes']
      ignore_errors: true

    - name: Require time synchronised against the Sensor private IP
      ansible.builtin.assert:
        that: verify_timesync.stdout_lines | default([]) == [sensor_private_ip, 'yes']
        fail_msg: "time server and synchronised={{ verify_timesync.stdout_lines | default([]) }}, expected {{ [sensor_private_ip, 'yes'] }}"

- name: Verify that the Sensor fails open with Suricata stopped in IPS mode
  hosts: sensors
  gather_facts: false

  vars:
    verify_honeypot: "{{ groups['honeypots'] | first }}"

  tasks:
    - name: Run the checks with Suricata stopped
      when: suricata_mode == 'ips'
      block:
        - name: Stop Suricata
          ansible.builtin.systemd_service:
            name: suricata.service
            state: stopped

        - name: Read the Containment drop counter
          ansible.builtin.command:
            cmd: nft list chain inet filter forward
          register: verify_fail_open_containment_before
          changed_when: false

        - name: Grab the Cowrie SSH banner on port 22
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 22
            search_regex: (SSH-2.0-.*)
            timeout: 30
          delegate_to: localhost
          become: false
          register: verify_fail_open_cowrie
          failed_when: false

        - name: Grab the OpenCanary FTP banner on port 21
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 21
            search_regex: "220 {{ honeypot_persona.ftp_banner | regex_escape }}"
            timeout: 30
          delegate_to: localhost
          become: false
          register: verify_fail_open_opencanary
          failed_when: false

        - name: Open a direct TCP connection from the Honeypot to the internet
          ansible.builtin.wait_for:
            host: "{{ verify_internet_host }}"
            port: "{{ verify_contained_port }}"
            timeout: 10
          delegate_to: "{{ verify_honeypot }}"
          become: false
          register: verify_fail_open_outbound
          failed_when: false

        - name: Read the Containment drop counter again
          ansible.builtin.command:
            cmd: nft list chain inet filter forward
          register: verify_fail_open_containment_after
          changed_when: false

      always:
        - name: Start Suricata again
          ansible.builtin.systemd_service:
            name: suricata.service
            state: started

    - name: Require open honeypot ports and Containment with Suricata stopped
      when: suricata_mode == 'ips'
      vars:
        verify_drops_before: "{{ (verify_fail_open_containment_before.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_drops_after: "{{ (verify_fail_open_containment_after.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_fail_open_cowrie.msg | default('')"
          - "'Timeout' not in verify_fail_open_opencanary.msg | default('')"
          - "'Timeout' in verify_fail_open_outbound.msg | default('')"
          - verify_drops_after | first | int > verify_drops_before | first | int
        fail_msg: >-
          port 22 banner={{ verify_fail_open_cowrie.msg | default('matched') }};
          port 21 banner={{ verify_fail_open_opencanary.msg | default('matched') }};
          direct outbound from {{ verify_honeypot }}={{ verify_fail_open_outbound.msg | default('connected') }};
          Containment drops before={{ verify_drops_before | first }} after={{ verify_drops_after | first }}
